name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CIC_TEST_DATABASE_URL: postgresql+psycopg://cic:change-me@localhost:5432/cic_test
  DATABASE_SCHEMA: cic
  JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cic
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: cic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cic -d cic_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: src/backend
    env:
      DATABASE_URL: postgresql+psycopg://cic:change-me@localhost:5432/cic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy .
      - run: pytest --cov=app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1

  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cic
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: cic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cic -d cic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            project/tools/requirements.txt
      - run: pip install -r project/tools/requirements.txt -r src/backend/requirements.txt openapi-spec-validator==0.9.0
      - run: openapi-spec-validator docs/api/openapi.yaml
      - run: python project/tools/check_screens.py
      - name: Apply migrations to an empty database
        working-directory: src/backend
        env:
          DATABASE_URL: postgresql+psycopg://cic:change-me@localhost:5432/cic
        run: alembic upgrade head

  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: package
        run: echo "present=$([ -f src/ai/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.package.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: steps.package.outputs.present == 'true'
        working-directory: src/ai
        run: pip install -e ".[dev]"
      - if: steps.package.outputs.present == 'true'
        working-directory: src/ai
        run: |
          ruff format --check .
          ruff check .
          mypy --strict .
          pytest
          cic-ai eval all

  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cic
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: cic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cic -d cic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cic:change-me@localhost:5432/cic
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f src/backend/Dockerfile -t cic-backend .
      - name: Migrate with the image
        run: >-
          docker run --rm --network host
          -e DATABASE_URL -e JWT_SECRET
          cic-backend alembic upgrade head
      - name: Start as api and check health
        run: |
          docker run -d --name cic-api --network host -e DATABASE_URL -e JWT_SECRET cic-backend api
          for attempt in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs cic-api
          exit 1
      - if: always()
        run: docker rm -f cic-api
