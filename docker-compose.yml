name: cic

x-build: &build
  image: cic-backend
  build:
    context: .
    dockerfile: src/backend/Dockerfile

x-backend: &backend
  <<: *build
  environment: &backend-environment
    APP_ENV: development
    DATABASE_URL: postgresql+psycopg://cic:${POSTGRES_PASSWORD:-change-me}@db:5432/cic
    DATABASE_SCHEMA: cic
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random string of at least 32 characters}
    CORS_ORIGINS: http://localhost:3000
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: cic
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cic -d cic"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *build
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    command: ["api"]
    ports:
      - "8000:8000"
    volumes:
      - import-files:/app/storage/imports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *backend
    command: ["worker"]
    profiles: ["worker"]
    environment:
      <<: *backend-environment
      WORKER_ID: worker-1
      WORKER_POLL_INTERVAL_SECONDS: "5"

  web:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run build && npm start"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_APP_NAME: CIC
    ports:
      - "3000:3000"
    volumes:
      - ./src/frontend:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  db-data:
  import-files:
  web-node-modules:
